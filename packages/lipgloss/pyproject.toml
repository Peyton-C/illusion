[project]
name = "lipgloss"
version = "1.6.0"
description = "Label rendering and print queue service for illusion"
requires-python = ">=3.14"
dependencies = [
    "illusion-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "niimprint",
    "pyserial>=3.5",
    "python-barcode>=0.16.1",
    "qrcode[pil]>=8.2",
]

[project.scripts]
lipgloss = "lipgloss.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
